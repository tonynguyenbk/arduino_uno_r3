; Mỗi bài học là một "env". Chọn env ở thanh trạng thái PlatformIO (dưới cùng VS Code),
; hoặc chạy lệnh:  pio run -e bai01 -t upload

[platformio]
default_envs = bai04

[env]
platform = atmelavr
board = uno
framework = arduino
; Cổng của board Arduino Uno (COM4 trên máy này là webcam, đừng dùng)
upload_port = COM5
monitor_port = COM5
monitor_speed = 9600
; Lưu mọi thứ Serial Monitor hiển thị vào file logs/device-monitor-*.log
monitor_filters = log2file

[env:bai01]
build_src_filter = +<bai01_blink/>

[env:bai02]
build_src_filter = +<bai02_serial/>

[env:bai03]
build_src_filter = +<bai03_led_ngoai/>

[env:bai04]
build_src_filter = +<bai04_nut_nhan/>

[env:bai05]
build_src_filter = +<bai05_millis/>

; Bài 5 bản debug: dùng debugger avr-stub (F5 trong VS Code). Debugger chiếm cổng Serial.
[env:bai05_debug]
build_src_filter = +<bai05_debug/>
build_type = debug
debug_tool = avr-stub
debug_port = COM5
lib_deps = jdolinay/avr-debugger @ ~1.5
; Debugger cần 1 chân ngắt riêng. Mặc định là chân 2 (đang cắm nút) -> chuyển sang chân 3 (để trống).
build_flags = -DAVR8_SWINT_SOURCE=1

[env:bai06]
build_src_filter = +<bai06_pwm/>

[env:bai07]
build_src_filter = +<bai07_analog/>

[env:bai08]
build_src_filter = +<bai08_ham_mang/>
