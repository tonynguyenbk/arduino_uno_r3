; Mỗi bài học là một "env". Chọn env ở thanh trạng thái PlatformIO (dưới cùng VS Code),
; hoặc chạy lệnh:  pio run -e lesson01 -t upload

[platformio]
default_envs = lesson07

[env]
platform = atmelavr
board = uno
framework = arduino
; Cổng của board Arduino Uno (COM4 trên máy này là webcam, đừng dùng)
upload_port = COM5
monitor_port = COM5
monitor_speed = 9600
; Lưu mọi thứ Serial Monitor hiển thị vào file logs/device-monitor-*.log
monitor_filters = log2file

[env:lesson01]
build_src_filter = +<lesson01_blink/>

[env:lesson02]
build_src_filter = +<lesson02_serial/>

[env:lesson03]
build_src_filter = +<lesson03_led_ngoai/>

[env:lesson04]
build_src_filter = +<lesson04_nut_nhan/>

[env:lesson05]
build_src_filter = +<lesson05_millis/>

; Bài 5 bản debug: dùng debugger avr-stub (F5 trong VS Code). Debugger chiếm cổng Serial.
[env:lesson05_debug]
build_src_filter = +<lesson05_debug/>
build_type = debug
debug_tool = avr-stub
debug_port = COM5
lib_deps = jdolinay/avr-debugger @ ~1.5
; Debugger cần 1 chân ngắt riêng. Mặc định là chân 2 (đang cắm nút) -> chuyển sang chân 3 (để trống).
build_flags = -DAVR8_SWINT_SOURCE=1

[env:lesson06]
build_src_filter = +<lesson06_pwm/>

[env:lesson07]
build_src_filter = +<lesson07_analog/>

[env:lesson08]
build_src_filter = +<lesson08_ham_mang/>

[env:lesson09]
build_src_filter = +<lesson09_led_7_doan/>

[env:lesson10]
build_src_filter = +<lesson10_sieu_am/>

[env:lesson11]
build_src_filter = +<lesson11_dht11/>

[env:lesson12]
build_src_filter = +<lesson12_lcd_oled/>
