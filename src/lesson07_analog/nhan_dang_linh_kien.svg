<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="38" font-size="22" font-weight="bold" fill="#111" text-anchor="middle">Nhận dạng linh kiện cho Bài 7 — tìm trong kit của bạn</text>

  <!-- ============ Ô 1: BIẾN TRỞ CÓ NÚM VẶN ============ -->
  <rect x="20" y="60" width="310" height="440" rx="10" fill="#f6f8fb" stroke="#c9d3e0"/>
  <text x="175" y="92" font-size="18" font-weight="bold" fill="#0e5aa7" text-anchor="middle">① BIẾN TRỞ (loại núm vặn)</text>
  <text x="175" y="114" font-size="12" fill="#555" text-anchor="middle">Tiếng Anh: potentiometer / "pot"</text>
  <!-- trục núm -->
  <rect x="160" y="140" width="30" height="80" rx="4" fill="#c9c9c9" stroke="#888"/>
  <line x1="166" y1="150" x2="166" y2="215" stroke="#aaa" stroke-width="2"/>
  <line x1="175" y1="150" x2="175" y2="215" stroke="#aaa" stroke-width="2"/>
  <line x1="184" y1="150" x2="184" y2="215" stroke="#aaa" stroke-width="2"/>
  <!-- ren -->
  <rect x="150" y="218" width="50" height="22" fill="#b0b0b0" stroke="#888"/>
  <!-- thân -->
  <rect x="105" y="240" width="140" height="90" rx="8" fill="#2a63b8" stroke="#1a3f78" stroke-width="2"/>
  <text x="175" y="290" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">B10K</text>
  <!-- 3 chân -->
  <rect x="128" y="330" width="8" height="55" fill="#bbb" stroke="#888"/>
  <rect x="171" y="330" width="8" height="55" fill="#bbb" stroke="#888"/>
  <rect x="214" y="330" width="8" height="55" fill="#bbb" stroke="#888"/>
  <text x="132" y="402" font-size="11" fill="#333" text-anchor="middle">chân 1</text>
  <text x="175" y="402" font-size="11" fill="#c00" text-anchor="middle" font-weight="bold">giữa</text>
  <text x="218" y="402" font-size="11" fill="#333" text-anchor="middle">chân 3</text>
  <text x="40" y="432" font-size="13" fill="#222">• Có <tspan font-weight="bold">núm/trục để vặn</tspan></text>
  <text x="40" y="452" font-size="13" fill="#222">• <tspan font-weight="bold">3 chân</tspan> xếp thẳng hàng</text>
  <text x="40" y="472" font-size="13" fill="#222">• Thường in: <tspan font-weight="bold">B10K</tspan>, <tspan font-weight="bold">10K</tspan> hoặc <tspan font-weight="bold">103</tspan></text>
  <text x="40" y="492" font-size="13" fill="#222">• Vỏ xanh dương, đen hoặc kim loại</text>

  <!-- ============ Ô 2: BIẾN TRỞ TINH CHỈNH ============ -->
  <rect x="345" y="60" width="310" height="440" rx="10" fill="#f6f8fb" stroke="#c9d3e0"/>
  <text x="500" y="92" font-size="18" font-weight="bold" fill="#0e5aa7" text-anchor="middle">② BIẾN TRỞ (loại nhỏ)</text>
  <text x="500" y="114" font-size="12" fill="#555" text-anchor="middle">Tiếng Anh: trimpot / trimmer — dùng thay ① được</text>
  <!-- thân vuông xanh -->
  <rect x="435" y="170" width="130" height="130" rx="10" fill="#3a7bd5" stroke="#1d4f9a" stroke-width="2"/>
  <circle cx="500" cy="235" r="40" fill="#e9e9e9" stroke="#999" stroke-width="2"/>
  <rect x="496" y="203" width="8" height="64" fill="#777"/>
  <rect x="468" y="231" width="64" height="8" fill="#777"/>
  <text x="500" y="290" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">103</text>
  <!-- 3 chân -->
  <rect x="453" y="300" width="7" height="45" fill="#bbb" stroke="#888"/>
  <rect x="496" y="300" width="7" height="45" fill="#bbb" stroke="#888"/>
  <rect x="540" y="300" width="7" height="45" fill="#bbb" stroke="#888"/>
  <text x="365" y="380" font-size="13" fill="#222">• Hình <tspan font-weight="bold">vuông nhỏ</tspan> (~1 cm), thường xanh</text>
  <text x="365" y="400" font-size="13" fill="#222">• Có <tspan font-weight="bold">rãnh chữ thập</tspan> để vặn bằng tua vít</text>
  <text x="365" y="420" font-size="13" fill="#222">  (hoặc vặn bằng móng tay)</text>
  <text x="365" y="440" font-size="13" fill="#222">• <tspan font-weight="bold">3 chân</tspan>, in số <tspan font-weight="bold">103</tspan> = 10kΩ</text>
  <text x="365" y="468" font-size="12" fill="#888">(103 = 10 và thêm 3 số 0 = 10.000 Ω)</text>

  <!-- ============ Ô 3: QUANG TRỞ ============ -->
  <rect x="670" y="60" width="310" height="440" rx="10" fill="#fdf8f3" stroke="#e5d3bd"/>
  <text x="825" y="92" font-size="18" font-weight="bold" fill="#b35a00" text-anchor="middle">③ QUANG TRỞ</text>
  <text x="825" y="114" font-size="12" fill="#555" text-anchor="middle">Tiếng Anh: LDR / photoresistor</text>
  <!-- mặt tròn -->
  <circle cx="825" cy="220" r="55" fill="#f2efe6" stroke="#c9b991" stroke-width="3"/>
  <path d="M790 192 H860 V202 H790 V212 H860 V222 H790 V232 H860 V242 H790 V252 H850"
        fill="none" stroke="#d2561b" stroke-width="5" stroke-linejoin="round"/>
  <rect x="784" y="186" width="6" height="72" fill="#c9c9c9"/>
  <rect x="860" y="182" width="6" height="72" fill="#c9c9c9"/>
  <!-- 2 chân -->
  <rect x="805" y="275" width="6" height="90" fill="#bbb" stroke="#888"/>
  <rect x="839" y="275" width="6" height="90" fill="#bbb" stroke="#888"/>
  <text x="690" y="400" font-size="13" fill="#222">• Mặt <tspan font-weight="bold">tròn dẹt</tspan> cỡ hạt đậu (~5 mm)</text>
  <text x="690" y="420" font-size="13" fill="#222">• Có <tspan font-weight="bold">đường lượn ziczac</tspan> màu đỏ/cam</text>
  <text x="690" y="440" font-size="13" fill="#222">• Chỉ <tspan font-weight="bold">2 chân</tspan>, không phân cực</text>
  <text x="690" y="460" font-size="13" fill="#222">• Che sáng → điện trở tăng vọt</text>
  <text x="690" y="488" font-size="12" fill="#c00" font-weight="bold">Cần đi kèm 1 điện trở 10kΩ (④)</text>

  <!-- ============ Ô 4: ĐIỆN TRỞ 10k ============ -->
  <rect x="20" y="515" width="960" height="110" rx="10" fill="#f9f9f4" stroke="#ddd8c4"/>
  <text x="40" y="545" font-size="18" font-weight="bold" fill="#6b5310">④ ĐIỆN TRỞ 10kΩ</text>
  <text x="40" y="567" font-size="12" fill="#555">Giống điện trở 220Ω bài 3,</text>
  <text x="40" y="583" font-size="12" fill="#555">chỉ khác vạch màu.</text>

  <!-- loại 4 vạch -->
  <line x1="290" y1="575" x2="510" y2="575" stroke="#999" stroke-width="3"/>
  <rect x="340" y="558" width="120" height="34" rx="14" fill="#e6c98f" stroke="#a88a50"/>
  <rect x="362" y="558" width="9" height="34" fill="#8b4513"/>
  <rect x="380" y="558" width="9" height="34" fill="#111"/>
  <rect x="398" y="558" width="9" height="34" fill="#f28c28"/>
  <rect x="435" y="558" width="9" height="34" fill="#c9a227"/>
  <text x="400" y="545" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Loại 4 vạch (thân vàng be)</text>
  <text x="400" y="612" font-size="12" fill="#222" text-anchor="middle"><tspan font-weight="bold">nâu – đen – cam</tspan> – vàng kim</text>

  <!-- loại 5 vạch -->
  <line x1="600" y1="575" x2="840" y2="575" stroke="#999" stroke-width="3"/>
  <rect x="650" y="558" width="140" height="34" rx="14" fill="#5b9bd5" stroke="#2e6aa3"/>
  <rect x="670" y="558" width="9" height="34" fill="#8b4513"/>
  <rect x="688" y="558" width="9" height="34" fill="#111"/>
  <rect x="706" y="558" width="9" height="34" fill="#111"/>
  <rect x="724" y="558" width="9" height="34" fill="#d00"/>
  <rect x="764" y="558" width="9" height="34" fill="#8b4513"/>
  <text x="720" y="545" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Loại 5 vạch (thân xanh)</text>
  <text x="720" y="612" font-size="12" fill="#222" text-anchor="middle"><tspan font-weight="bold">nâu – đen – đen – đỏ</tspan> – nâu</text>

  <text x="865" y="565" font-size="11" fill="#888">Mẹo: đọc từ đầu có</text>
  <text x="865" y="580" font-size="11" fill="#888">vạch dày đặc hơn;</text>
  <text x="865" y="595" font-size="11" fill="#888">vạch lẻ loi ở cuối</text>
  <text x="865" y="610" font-size="11" fill="#888">là sai số.</text>
</svg>
